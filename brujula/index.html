<title>Brújula de Objetivos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: columna única centrada; inicio = semana + tarjetas por prioridad; detalle = objetivo, porqué, tareas y registro de horas */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#18221d; --muted:#5d6b63; --line:#d9e0db;
  --accent:#2f6b4f; --accent-soft:#e2eee7;
  --p1:#2f6b4f; --p2:#3d4f9a; --p3:#a5651a; --p4:#1f7a83; --p5:#7a4a8c; --p6:#8a5a3c;
  --warn:#b4471f; --ok:#2f7d4a;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1a221e; --ink:#e6ece8; --muted:#9aa9a0; --line:#2c3832;
  --accent:#6fbf94; --accent-soft:#213229;
  --p1:#6fbf94; --p2:#8d9ef0; --p3:#e3a656; --p4:#5cc3cc; --p5:#c79ad9; --p6:#d49a76;
  --warn:#f0875f; --ok:#6fcf8f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1a221e; --ink:#e6ece8; --muted:#9aa9a0; --line:#2c3832;
  --accent:#6fbf94; --accent-soft:#213229;
  --p1:#6fbf94; --p2:#8d9ef0; --p3:#e3a656; --p4:#5cc3cc; --p5:#c79ad9; --p6:#d49a76;
  --warn:#f0875f; --ok:#6fcf8f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:920px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.7rem;font-weight:700}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.05rem;font-weight:600}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
header.top p{margin:4px 0 0}
button,.btn{font:inherit;font-size:.88rem;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
button.ghost{border-color:transparent;background:transparent;padding:5px 8px}
button.danger{color:var(--warn)}
button.small{font-size:.8rem;padding:4px 9px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* semana */
.week-bars{display:flex;flex-direction:column;gap:10px}
.wb{display:grid;grid-template-columns:minmax(90px,170px) 1fr 92px;gap:10px;align-items:center}
.wb .name{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;position:relative;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;border-radius:6px}
.wb .val{font-size:.8rem;text-align:right}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--pc);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;min-width:0}
.card:hover{box-shadow:0 2px 14px color-mix(in srgb,var(--pc) 18%,transparent)}
.chip{display:inline-flex;align-items:center;font-family:var(--f-mono);font-size:.75rem;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--pc) 16%,transparent);color:var(--pc);font-weight:500}
.why{font-size:.88rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:10px}
.stat b{display:block;font-family:var(--f-mono);font-size:.95rem;font-weight:500}
.stat span{font-size:.7rem;color:var(--muted)}
.prog{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pc)}
.next{font-size:.82rem}

/* detalle */
.detail-head{display:flex;flex-direction:column;gap:10px;border-left:5px solid var(--pc);padding-left:14px}
.quote{font-size:1rem;background:color-mix(in srgb,var(--pc) 9%,var(--surface));border-radius:10px;padding:14px 16px;white-space:pre-wrap}
.tasks{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.task:first-child{border-top:0}
.task .t-title{font-weight:500}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:3px}
.t-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.check{width:22px;height:22px;border-radius:6px;border:2px solid var(--pc);background:transparent;padding:0;margin-top:2px;display:grid;place-items:center;color:var(--bg);font-size:.8rem}
.check.on{background:var(--pc)}
.check.mid{background:linear-gradient(135deg,var(--pc) 50%,transparent 50%)}
.over{color:var(--warn)}
.inline-form{grid-column:1/-1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.logs{display:flex;flex-direction:column;gap:6px}
.log{display:grid;grid-template-columns:90px 70px 1fr auto;gap:10px;font-size:.85rem;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.log:first-child{border-top:0}
.empty{border:1px dashed var(--line);border-radius:10px;padding:16px;color:var(--muted);font-size:.9rem}

/* link tree */
.hub-head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:10px}
.hub-head p{margin:0}
.links{display:flex;flex-direction:column;gap:12px;max-width:580px;margin:0 auto;width:100%}
.link{display:grid;grid-template-columns:42px 1fr auto;gap:14px;align-items:center;padding:15px 16px;border-radius:14px;border:1px solid var(--line);border-left:5px solid var(--pc);background:var(--surface);color:var(--ink);text-align:left;cursor:pointer;width:100%}
.link:hover{border-color:var(--pc);box-shadow:0 2px 14px color-mix(in srgb,var(--pc) 18%,transparent)}
.link .ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;background:color-mix(in srgb,var(--pc) 16%,transparent);color:var(--pc)}
.link .lt{font-family:var(--f-display);font-size:1.08rem;font-weight:600;line-height:1.2}
.link .ls{font-size:.8rem;color:var(--muted);margin-top:2px}
.link .arr{color:var(--pc);font-size:1.2rem}
.hub-week{max-width:580px;margin:0 auto;width:100%}
/* finanzas */
.money-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.ms{background:var(--bg);border-radius:10px;padding:12px}
.ms b{display:block;font-family:var(--f-mono);font-size:1.15rem;font-weight:500;font-variant-numeric:tabular-nums}
.inc{color:var(--ok)} .exp{color:var(--warn)}
.cat{display:grid;grid-template-columns:minmax(90px,160px) 1fr 110px;gap:10px;align-items:center;font-size:.86rem}
.mov{display:grid;grid-template-columns:70px 1fr 120px auto;gap:10px;align-items:center;font-size:.86rem;padding:7px 0;border-top:1px solid var(--line)}
.mov:first-child{border-top:0}
.mov .amt{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tag{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--muted);margin-left:6px}
@media (max-width:560px){.mov{grid-template-columns:60px 1fr auto}.mov .ma{grid-column:1/-1;justify-self:end}.cat{grid-template-columns:1fr 100px}.cat .track{grid-column:1/-1;grid-row:2}}
/* calendario */
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(40px,1fr));gap:4px;min-width:300px}
.cw{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:2px 0}
.cd{min-height:64px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:4px;display:flex;flex-direction:column;gap:2px;align-items:stretch;text-align:left;cursor:pointer;min-width:0;overflow:hidden}
.cd.out{border:0;background:transparent;cursor:default}
.cd.today{border-color:var(--pc);border-width:2px}
.cd.has{background:color-mix(in srgb,var(--pc) 10%,var(--surface))}
.cd .dn{font-size:.75rem;color:var(--muted)}
.cd .ev{font-size:.66rem;line-height:1.2;background:var(--pc);color:var(--surface);border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd .ev.more{background:transparent;color:var(--pc)}
@media (max-width:560px){.cd{min-height:48px}.cd .ev{font-size:0;height:6px;padding:0}.cd .ev.more{display:none}}
.cd .ev.st-planificado{background:transparent;color:var(--pc);border:1px dashed var(--pc)}
.cd .ev.st-no-se-hizo{background:var(--line);color:var(--muted);text-decoration:line-through}
.ev-key{display:inline-block;width:12px;height:8px;border-radius:3px;background:var(--pc);vertical-align:middle;margin-right:4px}
.ev-key.st-planificado{background:transparent;border:1px dashed var(--pc)}
.ev-key.st-no-se-hizo{background:var(--line)}
.evrow{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px solid var(--line);font-size:.88rem}
.evrow:first-child,.confirm-box .label+.evrow{border-top:0}
.evrow.missed .ev-title{text-decoration:line-through;color:var(--muted)}
.st-tag-planificado{border-style:dashed;color:var(--pc)}
.st-tag-cumplido{color:var(--ok);border-color:var(--ok)}
.st-tag-no-se-hizo{color:var(--warn);border-color:var(--warn)}
.confirm-box{border:1px solid var(--warn);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}
@media (max-width:560px){.evrow .wk-det{padding-left:0!important}}
/* registro diario */
.day{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.thumb{position:relative;border-radius:10px;overflow:hidden;background:var(--bg);aspect-ratio:1;max-width:100%}
.thumb>button.ghost{width:100%;height:100%;display:block;border:0}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .xdel,.thumb .danger{position:absolute;top:4px;right:4px;background:var(--surface);border-color:var(--line)}
.cd .ph{width:6px;height:6px;border-radius:50%;background:var(--ink);align-self:flex-end;margin-top:auto}
.lightbox{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lightbox img{max-width:100%;max-height:90vh;border-radius:8px}
.lightbox button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px))}
/* espacios */
.spaces{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.space{display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:12px;border:1px solid var(--line);border-top:4px solid var(--pc);background:var(--bg);text-align:left;cursor:pointer;color:var(--ink);min-width:0}
.space:hover{border-color:var(--pc)}
.space .lt{font-family:var(--f-display);font-size:1.1rem;font-weight:600}
.space .ls{font-size:.8rem;color:var(--muted)}
.space.off{opacity:.5;cursor:not-allowed;border-top-color:var(--line)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.prows{display:flex;flex-direction:column;gap:6px}
.prow{display:grid;grid-template-columns:1fr 80px auto;gap:6px;align-items:center}
/* productos */
.prodbox{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.dose-rows{display:flex;flex-direction:column;gap:6px}
.dose-row{display:grid;grid-template-columns:1fr 80px 78px 80px auto;gap:6px;align-items:center}
.dose-tot{font-size:.8rem}
.cat-line{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.cat-line b{min-width:110px;font-size:.88rem}
.cat-item{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:1px 2px 1px 10px;font-size:.84rem}
@media (max-width:560px){.dose-row{grid-template-columns:1fr 70px 72px auto}.dose-row select[name=prodId]{grid-column:1/-1}.dose-tot{grid-column:1/3}}
/* equipamiento */
.eq-group{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.eq-group:first-of-type{border-top:0;padding-top:0}
.eq-item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:.88rem;padding:4px 0}
.checkf{display:flex;gap:8px;align-items:center;font-size:.88rem;align-self:end;padding-bottom:8px}
.checkf input{width:auto}
.aitag{font-size:.68rem;border:1px dashed var(--warn);color:var(--warn);border-radius:999px;padding:0 6px;white-space:nowrap}
.ports{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.port{display:flex;flex-direction:column;gap:2px;font-size:.75rem}
/* pestañas, ficha y planificador */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--pc)}
.fdl{display:flex;flex-direction:column;margin:0}
.frow{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:.9rem}
.frow:first-child{border-top:0}
.frow dt{color:var(--muted)} .frow dd{margin:0;min-width:0}
.flist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:.9rem}
.batch{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-left:4px solid var(--pc);border-radius:10px;padding:12px}
.batch .bt{font-family:var(--f-display);font-size:1.05rem}
@media (max-width:560px){.frow{grid-template-columns:1fr;gap:0}}
/* semana */
.week{display:flex;flex-direction:column;gap:8px}
.wk-day{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.wk-day.today{border-color:var(--pc);border-width:2px;background:var(--surface)}
.wk-head{display:flex;gap:8px;align-items:center;text-transform:capitalize}
.wk-ev{display:flex;flex-direction:column;gap:6px;font-size:.88rem;padding:6px 0 6px 10px;border-left:3px solid var(--pc)}
.wk-ev .t-actions{justify-content:flex-start}
.wk-sum{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:0;padding:2px 0;color:var(--ink)}
.wk-sum .ev-title{flex:1;min-width:0;font-weight:500}
.wk-sum .chev{color:var(--muted);font-size:.8rem}
.wk-det{display:flex;flex-direction:column;gap:6px;padding-bottom:4px}
.st-dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--pc)}
.st-dot.st-planificado{background:transparent;border:2px dashed var(--pc)}
.st-dot.st-no-se-hizo{background:var(--line)}
.wk-ev.missed .ev-title{text-decoration:line-through;color:var(--muted)}
.wk-day-ev{display:flex;flex-direction:column;gap:2px;padding-top:6px}
.sp-chip{font-size:.72rem;font-weight:600;color:var(--pc)}
/* asistente de riego */
.assist{background:color-mix(in srgb,var(--pc) 8%,var(--surface));border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.plan-rows{display:flex;flex-direction:column;gap:10px}
.plan-row{border:1px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.pd-rows{display:flex;flex-direction:column;gap:6px}
.tbl-wrap{overflow-x:auto}
.ptbl{border-collapse:collapse;font-size:.84rem;width:100%;min-width:420px}
.ptbl th,.ptbl td{border-top:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
.ptbl th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.wkm{display:grid;grid-template-columns:64px repeat(7,minmax(0,1fr));gap:3px}
.wkm-corner{min-height:1px}
.wkm-day{display:flex;flex-direction:column;align-items:center;gap:0;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:3px 0;font-size:.6rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);cursor:pointer;line-height:1.15}
.wkm-day b{font-size:.9rem;color:var(--ink)}
.wkm-day.today{border-color:var(--pc);border-width:2px}
.wkm-day.sel,.wkm-cell.sel{background:color-mix(in srgb,var(--pc) 14%,var(--surface))}
.wkm-sp{font-size:.74rem;font-weight:600;color:var(--pc);display:flex;align-items:center;border-left:3px solid var(--pc);padding-left:5px;word-break:break-word;min-width:0}
.wkm-cell{min-height:64px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:3px;display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:left;cursor:pointer;min-width:0;overflow:hidden;color:var(--ink)}
.wkm-cell.today{border-color:var(--pc)}
.wkc{min-height:110px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:4px;display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:left;cursor:pointer;min-width:0;overflow:hidden;color:var(--ink)}
.wkc.today{border-color:var(--pc);border-width:2px}
.wkc.sel{background:color-mix(in srgb,var(--pc) 14%,var(--surface))}
.wkc-h{display:flex;flex-direction:column;align-items:center;font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;line-height:1.1}
.wkc-h b{font-size:.9rem;color:var(--ink)}
.wkc-ev{font-size:.64rem;line-height:1.2;background:var(--pc);color:var(--surface);border-radius:4px;padding:2px 3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word;hyphens:auto}
.wkc-ev.st-planificado{background:transparent;color:var(--pc);border:1px dashed var(--pc)}
.wkc-ev.st-no-se-hizo{background:var(--line);color:var(--muted);text-decoration:line-through}
.wkc-more{font-size:.66rem;color:var(--muted)}
/* cronómetro */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.timerbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.timerbar .clock{font-family:var(--f-mono);font-size:1.25rem}
.timerbar button{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.notice{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:.9rem}
@media (max-width:560px){
  .task{grid-template-columns:28px 1fr}
  .t-actions{grid-column:2;justify-content:flex-start}
  .log{grid-template-columns:80px 60px 1fr}
  .log .la{grid-column:1/-1}
  .wb{grid-template-columns:1fr 84px}
  .wb .track{grid-column:1/-1;grid-row:2}
}
@media (prefers-reduced-motion:no-preference){.card{transition:box-shadow .15s}}
</style>

<div class="wrap" id="app">
  <header class="top">
    <div>
      <h1>Brújula de Objetivos</h1>
      <p class="muted">Cargando tus objetivos…</p>
    </div>
  </header>
</div>

<script>
(function(){
const PCOL=['--p1','--p2','--p3','--p4','--p5','--p6'];
const S={projects:[],tasks:[],logs:[],money:[],events:[],media:[],spaces:[],products:[],batches:[],plans:[],spaceTab:'ficha',fichaEdit:false,catalogOpen:false,space:null,spaceMsg:'',upload:null,lightbox:null,timer:null,month:null,calMonth:null,nav:null,form:null,confirm:null,loaded:{projects:false,tasks:false,logs:false},err:null};
function hashId(){try{return decodeURIComponent(location.hash.slice(1))}catch(e){return ''}}
const curId=()=>S.nav!==null?S.nav:hashId();
function go(id){S.nav=id||'';S.space=null;S.form=null;S.confirm=null;try{if(hashId()!==S.nav)location.hash=S.nav}catch(e){}window.scrollTo(0,0);rerender()}
const current=()=>S.projects.find(p=>p.id===curId());
const isLedger=p=>p&&p.kind==='ledger';
const ARS=new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});
const money=v=>ARS.format(Math.round(v));
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const monthName=m=>{const [y,mm]=m.split('-');return MESES[+mm-1]+' '+y};
const shiftMonth=(m,d)=>{let [y,mm]=m.split('-').map(Number);mm+=d;while(mm<1){mm+=12;y--}while(mm>12){mm-=12;y++}return y+'-'+String(mm).padStart(2,'0')};
function ledgerSums(p,month){
  const ms=S.money.filter(m=>m.ledgerId===p.id&&(m.date||'').startsWith(month));
  const inc=ms.filter(m=>m.type==='ingreso').reduce((s,m)=>s+num(m.amount),0);
  const exp=ms.filter(m=>m.type!=='ingreso').reduce((s,m)=>s+num(m.amount),0);
  return {ms,inc,exp,bal:inc-exp};
}
window.addEventListener('hashchange',()=>{const h=hashId();if(h===S.nav)return;S.nav=h;S.form=null;S.confirm=null;window.scrollTo(0,0);rerender()});
let db=null, assets=null, sample=null, pending=false;
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const h1=v=>{const r=Math.round(v*10)/10;return (r%1===0?r.toFixed(0):r.toFixed(1)).replace('.',',')};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=s=>{if(!s)return '';const [y,m,d]=s.split('-');return d+'/'+m+'/'+y.slice(2)};
function weekStart(){const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysLeft(s){if(!s)return null;const t=new Date(s+'T00:00:00');const n=new Date(today()+'T00:00:00');return Math.round((t-n)/86400000)}
const sortedProjects=()=>[...S.projects].sort((a,b)=>(num(a.priority)||99)-(num(b.priority)||99)||String(a.name).localeCompare(b.name));
const pcolor=p=>{const i=sortedProjects().findIndex(x=>x.id===p.id);return 'var('+PCOL[(i<0?0:i)%PCOL.length]+')'};
const tasksOf=pid=>S.tasks.filter(t=>t.projectId===pid).sort((a,b)=>(a.status==='hecha')-(b.status==='hecha')||(a.due||'9999').localeCompare(b.due||'9999')||num(a.createdAt)-num(b.createdAt));
const logsOf=pid=>S.logs.filter(l=>l.projectId===pid);
const minsSum=arr=>arr.reduce((s,l)=>s+num(l.minutes),0);
const taskMins=tid=>minsSum(S.logs.filter(l=>l.taskId===tid));

function projStats(p){
  const ts=tasksOf(p.id);const done=ts.filter(t=>t.status==='hecha');
  const est=ts.reduce((s,t)=>s+num(t.estHours),0);
  const estDone=done.reduce((s,t)=>s+num(t.estHours),0);
  const ls=logsOf(p.id);const ws=weekStart();
  return {ts,done,est,pct:est?estDone/est:(ts.length?done.length/ts.length:0),
    dedicated:minsSum(ls)/60,week:minsSum(ls.filter(l=>(l.date||'')>=ws))/60,
    next:ts.find(t=>t.status!=='hecha')};
}

/* ---------- render ---------- */
function render(){
  const a=document.activeElement;
  if(a&&app.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&!S._force){pending=true;return}
  S._force=false;pending=false;
  let html='';
  if(S.timer)html+=timerBar();
  if(S.err)html+=`<div class="notice">${esc(S.err)}</div>`;
  html+=brandDatalists();
  if(S.lightbox)html+=`<div class="lightbox" data-act="closeLb"><img src="${esc(S.lightbox)}" alt="Foto ampliada"><button data-act="closeLb">Cerrar</button></div>`;
  const cp=current();S.pid=cp?cp.id:null;
  html+= cp?(isLedger(cp)?ledgerView(cp):detailView()):homeView();
  app.innerHTML=html;
  app.querySelectorAll('form[data-form=event]').forEach(updateDoseTotals);
  app.querySelectorAll('form[data-form=item]').forEach(applyKindVisibility);
  app.querySelectorAll('form[data-form=batch],form[data-form=product],form[data-form=event]').forEach(applyBatchVis);
  tick();
}
app.addEventListener('focusout',()=>setTimeout(()=>{if(pending){const a=document.activeElement;if(!(a&&app.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render()}},0));
function rerender(){S._force=true;render()}

function timerBar(){
  const p=S.projects.find(x=>x.id===S.timer.projectId);const t=S.tasks.find(x=>x.id===S.timer.taskId);
  return `<div class="timerbar"><span class="label" style="color:inherit;opacity:.7">En curso</span>
  <span class="clock" id="clock">00:00:00</span>
  <span style="flex:1;min-width:0">${esc(p?p.name:'')}${t?' · '+esc(t.title):''}</span>
  <button data-act="stopTimer">Detener y registrar</button><button data-act="cancelTimer" class="small">Descartar</button></div>`;
}
function tick(){
  const el=document.getElementById('clock');if(!el||!S.timer)return;
  const s=Math.max(0,Math.floor((Date.now()-num(S.timer.startedAt))/1000));
  el.textContent=[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':');
}
setInterval(tick,1000);

function homeView(){
  const ps=sortedProjects();
  const loading=!db||!(S.loaded.projects&&S.loaded.tasks&&S.loaded.logs);
  let h=`<header class="hub-head"><h1>Brújula</h1>
    <p class="muted">Mis objetivos, mis números y el tiempo que le dedico a cada cosa.</p></header>`;
  if(loading&&!S.err){return h+`<div class="empty links">Cargando…</div>`}
  if(S.form&&S.form.type==='project'&&!S.form.id)h+=`<div class="panel links">${projectForm({})}</div>`;
  h+=`<nav class="links">${ps.map(linkItem).join('')||'<div class="empty">Todavía no hay secciones. Tocá «+ Agregar sección».</div>'}
    ${db&&!(S.form&&S.form.type==='project')?'<button class="ghost" data-act="newProject" style="align-self:center">+ Agregar sección</button>':''}</nav>`;
  const pj=ps.filter(p=>!isLedger(p));
  if(!pj.length)return h;
  const ws=weekStart();let tot=0,goal=0;
  const bars=pj.map(p=>{const st=projStats(p);tot+=st.week;const g=num(p.weeklyHours);goal+=g;
    const max=Math.max(g,st.week,1);
    return `<div class="wb" style="--pc:${pcolor(p)}"><span class="name">${esc(p.name)}</span>
      <div class="track" title="${h1(st.week)} h de ${g?h1(g)+' h':'sin meta'}"><div class="fill" style="width:${Math.min(100,st.week/max*100)}%;background:var(--pc)"></div>
      ${g?`<div style="position:absolute;top:-1px;bottom:-1px;left:calc(${Math.min(100,g/max*100)}% - 2px);width:2px;background:var(--ink)"></div>`:''}</div>
      <span class="val num">${h1(st.week)}${g?' / '+h1(g):''} h</span></div>`}).join('');
  h+=`<section class="panel hub-week"><div class="row"><h3>Tiempo esta semana</h3><span class="spacer"></span>
    <span class="num muted" style="font-size:.8rem">${h1(tot)} h${goal?' de '+h1(goal)+' h':''} · desde el lun ${fmtDate(ws)}</span></div>
    <div class="week-bars">${bars}</div>
    <span class="muted" style="font-size:.75rem">La raya marca la meta semanal de horas (se carga en «Editar objetivo»).</span></section>`;
  return h;
}
function linkItem(p,i){
  let sub;
  if(isLedger(p)){const m=today().slice(0,7);const s=ledgerSums(p,m);
    sub=`Saldo de ${MESES[+m.slice(5)-1]}: <span class="num ${s.bal<0?'exp':''}">${money(s.bal)}</span>`;}
  else{const st=projStats(p);
    sub=st.ts.length?`${st.done.length}/${st.ts.length} tareas · ${h1(st.week)} h esta semana${st.next?' · Próxima: '+esc(st.next.title):''}`:'Sin tareas: entrá y armá el plan';}
  return `<button class="link" style="--pc:${pcolor(p)}" data-act="open" data-id="${esc(p.id)}">
    <span class="ico">${isLedger(p)?'$':i+1}</span>
    <span style="min-width:0"><span class="lt">${esc(p.name)}</span><span class="ls" style="display:block">${sub}</span></span>
    <span class="arr" aria-hidden="true">→</span></button>`;
}

function projectForm(p){
  const led=p.id?isLedger(p):false;
  const showP=p.id?!led:true, showL=p.id?led:false;
  return `<form class="field" data-form="project" data-id="${esc(p.id||'')}" style="gap:12px">
    <h3>${p.id?'Editar sección':'Nueva sección'}</h3>
    <div class="grid2">
      <label class="field"><span class="label">Nombre</span><input id="f-name" name="name" required value="${esc(p.name)}"></label>
      <label class="field"><span class="label">Orden / prioridad (1 = arriba)</span><input id="f-prio" name="priority" type="number" min="1" value="${esc(p.priority||'')}"></label>
      ${p.id?'':`<label class="field"><span class="label">Tipo</span><select id="f-kind" name="kind" data-kind-toggle>
        <option value="project">Objetivo con tareas y horas</option><option value="ledger">Finanzas (ingresos y gastos)</option></select></label>`}
    </div>
    <div class="field only-ledger" style="gap:12px" ${showL?'':'hidden'}>
      <label class="field"><span class="label">Separar movimientos por (opcional, separado por comas)</span><input id="f-scopes" name="scopes" value="${esc((p.scopes||[]).join(', '))}" placeholder="Ej.: Casa, Mío"></label>
    </div>
    <div class="field only-project" style="gap:12px" ${showP?'':'hidden'}>
    <label class="field"><span class="label">Objetivo (qué quiero lograr, medible)</span><textarea id="f-goal" name="goal">${esc(p.goal)}</textarea></label>
    <label class="field"><span class="label">Por qué tengo que cumplirlo</span><textarea id="f-why" name="why">${esc(p.why)}</textarea></label>
    <div class="grid2">
      <label class="field"><span class="label">Fecha objetivo</span><input id="f-deadline" name="deadline" type="date" value="${esc(p.deadline)}"></label>
      <label class="field"><span class="label">Meta de horas por semana</span><input id="f-weekly" name="weeklyHours" inputmode="decimal" value="${esc(p.weeklyHours||'')}"></label>
    </div>
    <label class="field"><span class="label">Recursos generales (dinero, materiales, personas, herramientas)</span><textarea id="f-res" name="resources">${esc(p.resources)}</textarea></label>
    </div>
    <div class="row"><button class="primary" type="submit">Guardar</button><button type="button" data-act="cancelForm">Cancelar</button></div>
  </form>`;
}
function taskForm(t,pid){
  return `<form class="inline-form" data-form="task" data-id="${esc(t.id||'')}" data-pid="${esc(pid)}">
    <label class="field"><span class="label">Tarea</span><input id="t-title" name="title" required value="${esc(t.title)}"></label>
    <div class="grid2">
      <label class="field"><span class="label">Horas estimadas</span><input id="t-est" name="estHours" inputmode="decimal" value="${esc(t.estHours||'')}"></label>
      <label class="field"><span class="label">Fecha límite</span><input id="t-due" name="due" type="date" value="${esc(t.due)}"></label>
      <label class="field"><span class="label">Estado</span><select id="t-status" name="status">
        ${['pendiente','en curso','hecha'].map(s=>`<option ${ (t.status||'pendiente')===s?'selected':''}>${s}</option>`).join('')}</select></label>
    </div>
    <label class="field"><span class="label">Recursos necesarios</span><input id="t-res" name="resources" value="${esc(t.resources)}" placeholder="Ej.: materiales, costo, a quién necesito"></label>
    <div class="row"><button class="primary" type="submit">Guardar tarea</button><button type="button" data-act="cancelForm">Cancelar</button></div>
  </form>`;
}
function logForm(pid,tid){
  return `<form class="inline-form" data-form="log" data-pid="${esc(pid)}" data-tid="${esc(tid||'')}">
    <div class="grid2">
      <label class="field"><span class="label">Tiempo (horas, ej. 1,5)</span><input id="l-h" name="hours" inputmode="decimal" required></label>
      <label class="field"><span class="label">Fecha</span><input id="l-date" name="date" type="date" value="${today()}"></label>
    </div>
    <label class="field"><span class="label">Qué hice (opcional)</span><input id="l-note" name="note"></label>
    <div class="row"><button class="primary" type="submit">Registrar</button><button type="button" data-act="cancelForm">Cancelar</button></div>
  </form>`;
}

function ledgerView(p){
  const pc=pcolor(p);const month=S.month||today().slice(0,7);const f=S.form;
  const scopes=p.scopes||[];const s=ledgerSums(p,month);
  let h=`<div class="row"><button class="ghost" data-act="home">← Inicio</button></div>`;
  if(f&&f.type==='project'&&f.id===p.id)return h+`<div class="panel" style="--pc:${pc}">${projectForm(p)}</div>`;
  h+=`<section class="detail-head" style="--pc:${pc}"><div class="row"><span class="chip">Finanzas</span><span class="spacer"></span>
    <button class="small" data-act="editProject">Editar sección</button>
    ${S.confirm==='p'+p.id?`<button class="small danger" data-act="delProject">Confirmar borrado (borra todos los movimientos)</button><button class="small" data-act="noConfirm">No</button>`:`<button class="small danger" data-act="askDel" data-key="p${esc(p.id)}">Borrar</button>`}</div>
    <h1>${esc(p.name)}</h1></section>`;
  h+=`<section class="panel" style="--pc:${pc}"><div class="row">
      <button class="small" data-act="prevMonth" aria-label="Mes anterior">‹</button>
      <h2 style="min-width:0">${monthName(month)}</h2>
      <button class="small" data-act="nextMonth" aria-label="Mes siguiente">›</button>
      <span class="spacer"></span><button class="primary small" data-act="newMove">+ Movimiento</button></div>
    ${f&&f.type==='move'?moveForm(p):''}
    <div class="money-sum">
      <div class="ms"><span class="label">Ingresos</span><b class="inc">${money(s.inc)}</b></div>
      <div class="ms"><span class="label">Gastos</span><b class="exp">${money(s.exp)}</b></div>
      <div class="ms"><span class="label">Saldo</span><b class="${s.bal<0?'exp':''}">${money(s.bal)}</b></div>
    </div>
    ${scopes.length?`<div class="money-sum">${[...scopes,''].map(sc=>{const ms=s.ms.filter(m=>(m.scope||'')===sc);if(!sc&&!ms.length)return '';
      const i=ms.filter(m=>m.type==='ingreso').reduce((a,m)=>a+num(m.amount),0),e=ms.filter(m=>m.type!=='ingreso').reduce((a,m)=>a+num(m.amount),0);
      return `<div class="ms"><span class="label">${esc(sc||'Sin asignar')}</span><div class="num" style="font-size:.85rem"><span class="inc">+${money(i)}</span> · <span class="exp">−${money(e)}</span></div><b class="${i-e<0?'exp':''}" style="font-size:1rem">${money(i-e)}</b></div>`}).join('')}</div>`:''}
  </section>`;
  // categorías de gasto
  const cats={};s.ms.filter(m=>m.type!=='ingreso').forEach(m=>{const c=m.category||'Sin categoría';cats[c]=(cats[c]||0)+num(m.amount)});
  const cl=Object.entries(cats).sort((a,b)=>b[1]-a[1]);const mx=cl.length?cl[0][1]:1;
  h+=`<section class="panel" style="--pc:${pc}"><h2>Gastos por categoría</h2>${cl.length?cl.map(([c,v])=>`<div class="cat"><span>${esc(c)}</span>
    <div class="track"><div class="fill" style="width:${v/mx*100}%;background:var(--pc)"></div></div><span class="num" style="text-align:right">${money(v)}</span></div>`).join('')
    :'<div class="empty">Sin gastos cargados en este mes.</div>'}</section>`;
  const list=[...s.ms].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||num(b.createdAt)-num(a.createdAt));
  h+=`<section class="panel"><h2>Movimientos</h2>${list.length?`<div>${list.map(m=>`<div class="mov"><span class="num">${fmtDate(m.date)}</span>
    <span style="min-width:0">${esc(m.category||'Sin categoría')}${m.scope?`<span class="tag">${esc(m.scope)}</span>`:''}${m.note?' <span class="muted">· '+esc(m.note)+'</span>':''}</span>
    <span class="amt ${m.type==='ingreso'?'inc':'exp'}">${m.type==='ingreso'?'+':'−'}${money(num(m.amount))}</span>
    <span class="ma">${S.confirm==='m'+m.id?`<button class="small danger" data-act="delMove" data-id="${esc(m.id)}">Borrar</button>`:`<button class="ghost small" data-act="askDel" data-key="m${esc(m.id)}" aria-label="Borrar movimiento">✕</button>`}</span></div>`).join('')}</div>`
    :'<div class="empty">Sin movimientos en este mes. Tocá «+ Movimiento» para cargar un ingreso o un gasto.</div>'}</section>`;
  return h;
}
function moveForm(p){
  const cats=[...new Set(S.money.filter(m=>m.ledgerId===p.id&&m.category).map(m=>m.category))].sort();
  const scopes=p.scopes||[];
  return `<form class="inline-form" data-form="move" data-pid="${esc(p.id)}">
    <div class="grid2">
      <label class="field"><span class="label">Tipo</span><select id="m-type" name="type"><option value="gasto">Gasto</option><option value="ingreso">Ingreso</option></select></label>
      <label class="field"><span class="label">Monto ($)</span><input id="m-amount" name="amount" inputmode="decimal" required></label>
      <label class="field"><span class="label">Fecha</span><input id="m-date" name="date" type="date" value="${today()}"></label>
    </div>
    <div class="grid2">
      <label class="field"><span class="label">Categoría</span><input id="m-cat" name="category" list="m-cats" placeholder="Ej.: supermercado, sueldo, servicios"><datalist id="m-cats">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label>
      ${scopes.length?`<label class="field"><span class="label">De quién</span><select id="m-scope" name="scope">${scopes.map(sc=>`<option>${esc(sc)}</option>`).join('')}</select></label>`:''}
      <label class="field"><span class="label">Nota (opcional)</span><input id="m-note" name="note"></label>
    </div>
    <div class="row"><button class="primary" type="submit">Guardar movimiento</button><button type="button" data-act="cancelForm">Cancelar</button></div>
  </form>`;
}
const EV_TYPES=['Trasplante','Cambio de horas de luz','Riego foliar','Riego radicular','Germinación','Poda / entrenamiento','Inicio de floración','Cosecha','Secado / curado','Otro'];
const evStatus=e=>e.status||'cumplido';
const ST_LABEL={planificado:'Planificado',cumplido:'Cumplido','no se hizo':'No se hizo'};
function calendarPanel(p,pc){
  const month=S.calMonth||today().slice(0,7);const f=S.form;
  const evs=S.events.filter(e=>e.projectId===p.id&&(e.spaceId||'')===(S.space||''));
  const [y,m]=month.split('-').map(Number);
  const first=new Date(y,m-1,1);const lead=first.getDay();const days=new Date(y,m,0).getDate();
  const t=today();
  let cells='';
  for(let i=0;i<lead;i++)cells+='<div class="cd out"></div>';
  for(let d=1;d<=days;d++){
    const ds=month+'-'+String(d).padStart(2,'0');const de=evs.filter(e=>e.date===ds);
    cells+=`<button class="cd ${ds===t?'today':''} ${de.length?'has':''}" data-act="calDay" data-date="${ds}" aria-label="${d} de ${MESES[m-1]}${de.length?': '+esc(de.map(e=>e.title+' ('+ST_LABEL[evStatus(e)]+')').join(', ')):''}">
      <span class="dn num">${d}</span>${de.slice(0,2).map(e=>`<span class="ev st-${evStatus(e).replace(/ /g,'-')}">${esc(e.title)}</span>`).join('')}${de.length>2?`<span class="ev more">+${de.length-2}</span>`:''}${S.media.some(x=>x.projectId===p.id&&(x.spaceId||'')===(S.space||'')&&x.date===ds)?'<span class="ph" title="Tiene fotos o videos"></span>':''}</button>`;
  }
  const list=evs.filter(e=>(e.date||'').startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date));
  const germ=evs.filter(e=>e.type==='Germinación'&&evStatus(e)==='cumplido'&&e.date<=t).sort((a,b)=>b.date.localeCompare(a.date));

async function uploadMedia(f){
  const files=[...(f.querySelector('input[type=file]').files||[])];const date=f.querySelector('[name=date]').value||today();const caption=f.querySelector('[name=caption]').value.trim();
  if(!files.length)return;
  const big=files.filter(x=>x.size>MAXB);
  S.upload={busy:true,date,msg:`Subiendo 0 de ${files.length - big.length}…`};rerender();
  let ok=0;const fails=big.map(x=>`${x.name} pesa ${(x.size/1048576).toFixed(0)} MB (máximo 20 MB)`);
  for(const file of files){ if(file.size>MAXB)continue;
    try{const r=await assets.upload(file);
      await db.collection('media').add({projectId:f.dataset.pid,spaceId:S.space||'',date,assetId:r.id,contentType:r.contentType||file.type,caption,createdAt:Date.now()});
      ok++;S.upload.msg=`Subiendo ${ok} de ${files.length-big.length}…`;rerender();

async function aiFill(form){

  const keys=LIGHT_SCHEMA.filter(f=>f.ai).map(f=>f.k);
  const prompt=`Sos un asistente técnico de iluminación para cultivo indoor. Lámpara: tipo "${type}", marca "${brand}", modelo "${model}".

  }catch(e){msg.textContent=e&&e.code==='not_granted'?'Permiso denegado para consultar a Claude.':e&&e.code==='rate_limited'?'Demasiadas consultas; probá en un rato.':'No se pudo consultar. Cargalos a mano.'}

function substrateOf(b){return S.products.find(x=>x.use==='sustrato'&&prodLabel(x)===b.substrate)}
function riegoAssist(b){
  if(!b.startDate)return '';
  const days=-daysLeft(b.startDate);if(days<0)return '';
  const week=Math.floor(days/7)+1;
  const pot=num(b.potLiters),qty=num(b.qty),pct=num(b.wateringPct);
  const sub=substrateOf(b);const feed=sub?num(sub.feedWeeks):0;
  const plan=S.plans.find(x=>x.id===b.planId);
  const row=plan&&(plan.rows||[]).find(r=>num(r.fromWeek)<=week&&week<=num(r.toWeek||999));
  // litros
  const ruleL=pot&&pct?pot*pct/100:0;
  const hist=S.events.filter(e=>e.batchId===b.id&&e.type==='Riego radicular'&&evStatus(e)==='cumplido'&&num(e.perPlant)>0&&e.drained==='si').sort((a,c)=>c.date.localeCompare(a.date)).slice(0,5);
  const learnL=hist.length>=3?hist.reduce((a,e)=>a+num(e.perPlant),0)/hist.length:0;
  const useL=learnL||ruleL;const totL=useL*qty;
  const r1=v=>dec(Math.round(v*100)/100);
  let lit=ruleL?`<div>Por tu regla (${dec(pct)} % de ${dec(pot)} L): <b class="num">${r1(ruleL)} L por planta</b> · ${r1(ruleL*qty)} L para las ${qty}</div>`:`<div class="muted">Definí tu regla de riego (% de la maceta) y los litros de maceta con «Editar».</div>`;
  lit+=learnL?`<div>Según tus últimos ${hist.length} riegos con drenaje: <b class="num">${r1(learnL)} L por planta</b></div>`:`<div class="muted" style="font-size:.8rem">Con 3 riegos registrados con litros por planta y drenaje, se suma el promedio de tus riegos (${hist.length}/3).</div>`;
  // fertilizante
  let fert;
  if(sub&&feed&&week<=feed)fert=`<div><b>Sin fertilizante:</b> el sustrato nutre hasta la semana ${feed} (${fmtDate(addDays(b.startDate,feed*7))}). Desde ahí, según la tabla.</div>`;
  else if(!plan)fert=`<div class="muted">Elegí una tabla de fertilización para el lote con «Editar».${sub&&!feed?' Cargá también cuántas semanas nutre el sustrato.':''}</div>`;
  else if(!row)fert=`<div class="muted">La tabla «${esc(plan.name)}» no tiene una etapa para la semana ${week}.</div>`;
  else fert=`<div><b>${esc(row.stage)}</b> (tabla «${esc(plan.name)}»${plan.verified?'':', a verificar'})${sub&&!feed?' · <span class="muted">no sé cuántas semanas nutre el sustrato</span>':''}</div>
    ${(row.doses||[]).map(x=>`<div class="num">${esc(x.label)}: ${dec(x.dose)} ${esc(x.unit)}/L${totL?` → ${r1(num(x.dose)*totL)} ${esc(x.unit)} en ${r1(totL)} L`:''}</div>`).join('')||'<div class="muted">Esta etapa no tiene dosis cargadas.</div>'}
    ${row.ecMin!==''||row.ecMax!==''?`<div class="muted" style="font-size:.82rem">Objetivo: CE ${rng(row.ecMin,row.ecMax,'mS/cm')}${row.phMin!==''||row.phMax!==''?' · pH '+rng(row.phMin,row.phMax):''}</div>`:''}`;
  // mediciones
  const last=S.events.filter(e=>e.batchId===b.id&&(e.ecIn!==''&&e.ecIn!=null||e.phIn!==''&&e.phIn!=null||e.ecOut!==''&&e.ecOut!=null||e.phOut!==''&&e.phOut!=null)).sort((a,c)=>c.date.localeCompare(a.date))[0];
  const flag=(v,a,c)=>v===''||v==null?'':(a!==''&&a!=null&&num(v)<num(a))?' <span class="exp">bajo</span>':(c!==''&&c!=null&&num(v)>num(c))?' <span class="exp">alto</span>':(row&&(a!==''||c!=='')?' <span class="inc">en rango</span>':'');
  const meas=last?`<div class="muted" style="font-size:.82rem">Última medición (${fmtDate(last.date)}): agua CE ${last.ecIn!==''&&last.ecIn!=null?dec(last.ecIn):'—'}${row?flag(last.ecIn,row.ecMin,row.ecMax):''} · pH ${last.phIn!==''&&last.phIn!=null?dec(last.phIn):'—'}${row?flag(last.phIn,row.phMin,row.phMax):''} · drenaje CE ${last.ecOut!==''&&last.ecOut!=null?dec(last.ecOut):'—'} · pH ${last.phOut!==''&&last.phOut!=null?dec(last.phOut):'—'}</div>`:'';
  const pre=useL?encodeURIComponent(JSON.stringify({liters:Math.round(totL*100)/100,perPlant:Math.round(useL*100)/100,products:row&&!(sub&&feed&&week<=feed)?(row.doses||[]):[]})):'';
  return `<div class="assist"><div class="row"><span class="label">Riego sugerido · semana ${week} (día ${days})</span><span class="spacer"></span>
    <button class="small" data-act="planRiego" data-id="${esc(b.id)}" data-pre="${pre}">Planificar este riego</button></div>${lit}${fert}${meas}</div>`;
}

async function saveBatch(f,d){
  const sid=f.dataset.sid;const n=v=>{const t=String(v||'').trim();return t===''?'':num(t)};
  const data={genetics:(d.genetics||'').trim(),qty:Math.max(0,Math.round(num(d.qty))),startDate:d.startDate||today(),cropType:d.cropType||'',origin:d.origin||'',
    originSpaceId:d.origin==='Otro espacio'?(d.originSpaceId||''):'',potLiters:n(d.potLiters),substrate:d.cropType==='Sustrato'?(d.substrate||'').trim():'',note:(d.note||'').trim(),planId:d.planId||'',wateringPct:n(d.wateringPct)};
  if(!data.qty){S.err='Cargá la cantidad de plantas.';rerender();return}
  if(f.dataset.id)await db.doc('batches/'+f.dataset.id).update(data);
  else await db.collection('batches').add({...data,projectId:'cultivo',spaceId:sid,status:'activo',history:[{date:data.startDate,text:`Inicio: ${data.qty} plantas en ${spaceName(sid)}`}],createdAt:Date.now()});
}
async function transferBatch(b,qty,dest,date){
  const src=spaceName(b.spaceId),dst=spaceName(dest);qty=Math.round(qty);
  if(!(qty>0)||qty>num(b.qty)){S.err=`La cantidad tiene que ser entre 1 y ${num(b.qty)}.`;rerender();return}
  const h=b.history||[];
  if(qty>=num(b.qty)){await db.doc('batches/'+b.id).update({spaceId:dest,history:[...h,{date,text:`Transferidas ${qty} plantas de ${src} a ${dst}`}]});return}
  await db.doc('batches/'+b.id).update({qty:num(b.qty)-qty,history:[...h,{date,text:`Se transfirieron ${qty} plantas a ${dst}`}]});
  const {id,...rest}=b;
  await db.collection('batches').add({...rest,qty,spaceId:dest,parentId:b.id,history:[...h,{date,text:`Llegaron ${qty} plantas desde ${src}`}],createdAt:Date.now()});
}
function detailView(){

  else{

    ${p.resources?`<div><div class="label">Recursos generales</div><div style="white-space:pre-wrap">${esc(p.resources)}</div></div>`:''}
  </section>`;}
  h+=`<section class="panel" style="--pc:${pc}"><div class="stats" style="border:0;padding:0;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">
    <div class="stat"><b>${st.done.length}/${st.ts.length}</b><span>tareas hechas</span></div>
    <div class="stat"><b>${h1(st.est)} h</b><span>estimadas en total</span></div>
    <div class="stat"><b>${h1(st.dedicated)} h</b><span>dedicadas en total</span></div>
    <div class="stat"><b>${h1(st.week)}${num(p.weeklyHours)?' / '+h1(num(p.weeklyHours)):''} h</b><span>esta semana${num(p.weeklyHours)?' / meta':''}</span></div>
    <div class="stat"><b>${Math.round(st.pct*100)}%</b><span>avance (por horas estimadas)</span></div>
  </div><div class="prog"><i style="width:${Math.round(st.pct*100)}%"></i></div></section>`;
  if(p.calendar&&!spacesOf(p.id).length)h+=calendarPanel(p,pc)+mediaPanel(p,pc);
  // tareas
  h+=`<section class="panel" style="--pc:${pc}"><div class="row"><h2>Plan de tareas</h2><span class="spacer"></span>

  if(f&&f.type==='log'&&!f.tid)h+=logForm(p.id,'');
  if(f&&f.type==='task'&&!f.id)h+=taskForm({},p.id);
  if(!st.ts.length&&!(f&&f.type==='task'))h+=`<div class="empty">Sin tareas todavía. Dividí el objetivo en pasos concretos, con horas estimadas y lo que necesitás para cada uno.</div>`;
  h+=`<div class="tasks">${st.ts.map(t=>taskRow(t,p)).join('')}</div></section>`;
  // registro
  const ls=logsOf(p.id).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||num(b.createdAt)-num(a.createdAt)).slice(0,30);
  h+=`<section class="panel"><h2>Registro de tiempo</h2>${ls.length?`<div class="logs">${ls.map(l=>{const t=S.tasks.find(x=>x.id===l.taskId);
    return `<div class="log"><span class="num">${fmtDate(l.date)}</span><span class="num">${h1(num(l.minutes)/60)} h</span>
    <span style="min-width:0">${t?esc(t.title):'<span class="muted">General</span>'}${l.note?' <span class="muted">· '+esc(l.note)+'</span>':''}</span>

    :'<div class="empty">Todavía no registraste tiempo. Usá ▶ en una tarea para cronometrar o «+ h» para cargar a mano.</div>'}</section>`;
  return h;
}
function taskRow(t,p){
  const f=S.form;
  if(f&&f.type==='task'&&f.id===t.id)return `<div class="task">${taskForm(t,p.id)}</div>`;
  const ded=taskMins(t.id)/60;const est=num(t.estHours);const dl=daysLeft(t.due);
  const cls=t.status==='hecha'?'on':(t.status==='en curso'?'mid':'');
  const running=S.timer&&S.timer.taskId===t.id;
  return `<div class="task ${t.status==='hecha'?'done':''}">
    <button class="check ${cls}" data-act="cycle" data-id="${esc(t.id)}" title="Estado: ${esc(t.status||'pendiente')} (tocar para cambiar)" aria-label="Cambiar estado">${t.status==='hecha'?'✓':''}</button>
    <div style="min-width:0"><div class="t-title">${esc(t.title)}</div>
      <div class="t-meta"><span class="num ${est&&ded>est?'over':''}">${h1(ded)}${est?' / '+h1(est):''} h</span>
      ${t.due?`<span class="num ${dl!==null&&dl<0&&t.status!=='hecha'?'over':''}">vence ${fmtDate(t.due)}</span>`:''}
      <span>${esc(t.status||'pendiente')}</span>
      ${t.resources?`<span>Recursos: ${esc(t.resources)}</span>`:''}</div></div>
    <div class="t-actions">
      ${t.status!=='hecha'?`<button class="small" data-act="startTimer" data-id="${esc(t.id)}" ${running?'disabled':''} title="Cronometrar">${running?'● en curso':'▶'}</button>`:''}
      <button class="small" data-act="logTask" data-id="${esc(t.id)}" title="Cargar horas a mano">+ h</button>
      <button class="small ghost" data-act="editTask" data-id="${esc(t.id)}">Editar</button>
      ${S.confirm==='t'+t.id?`<button class="small danger" data-act="delTask" data-id="${esc(t.id)}">Confirmar</button>`:`<button class="small ghost danger" data-act="askDel" data-key="t${esc(t.id)}" aria-label="Borrar tarea">✕</button>`}
    </div>
    ${f&&f.type==='log'&&f.tid===t.id?logForm(p.id,t.id):''}
  </div>`;
}

      for(const ev of S.events.filter(x=>x.projectId===pid))await db.doc('events/'+ev.id).delete();
      await db.doc('projects/'+pid).delete();go('')})},
  };
  if(A[act]&&(db||['home','open','toggleEv','wkDay','wkCell','wkClose','addPlanRow','rmPlanRow','addPlanDose','rmPlanDose','addPlantRow','rmPlantRow','closeSpace','addDoseRow','rmDoseRow','toggleCatalog'].includes(act)))A[act]();
});
async function saveTimerLog(){
  const T=S.timer;if(!T)return;
  const mins=Math.round((Date.now()-num(T.startedAt))/60000);
  if(mins>=1)await db.collection('logs').add({projectId:T.projectId,taskId:T.taskId||'',minutes:mins,date:today(),note:'Cronómetro',createdAt:Date.now()});
}
app.addEventListener('change',e=>{
  if(e.target.matches('[data-kind-toggle]')){const fm=e.target.closest('form');const led=e.target.value==='ledger';
    fm.querySelector('.only-ledger').hidden=!led;fm.querySelector('.only-project').hidden=led;}
  if(e.target.matches('[data-bvis]'))applyBatchVis(e.target.closest('form'));
  if(e.target.matches('[data-kindsel]'))applyKindVisibility(e.target.closest('form'));
  if(e.target.matches('[data-evtype]')){const fm=e.target.closest('form');const use=RIEGO_USE[e.target.value]||'';const box=fm.querySelector('.prodbox');
    box.hidden=!use;const rows=box.querySelector('.dose-rows');
    if(use){const prev=rows.dataset.use;if(prev!==use){rows.innerHTML=prodRow(use,{});rows.dataset.use=use}}}
  if(e.target.closest('.prodbox'))updateDoseTotals(e.target.closest('form'));
});
app.addEventListener('input',e=>{
  if(e.target.matches('[data-ports]')){const pos=e.target.dataset.ports;const box=document.getElementById('ports-'+pos);
    const vals=[...box.querySelectorAll('input')].map(i=>i.value);box.innerHTML=portInputs(pos,num(e.target.value),vals);}if(e.target.closest('.prodbox'))updateDoseTotals(e.target.closest('form'))});
app.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;const d=Object.fromEntries(new FormData(f).entries());
  const kind=f.dataset.form;
  if(kind==='media'){uploadMedia(f).catch(()=>{});return}
  if(kind==='item'){const key=f.dataset.key,idx=+f.dataset.idx;const sp=S.spaces.find(x=>x.id===f.dataset.sid);if(!sp||!EQUIP[key])return;
    const it={};const kindV=d.kind;
    for(const fd of EQUIP[key].schema){
      if(fd.when&&fd.when!==kindV)continue; if(fd.whenNot&&fd.whenNot===kindV)continue;
      if(fd.t==='check')it[fd.k]=!!f.querySelector(`[name=${fd.k}]`)?.checked;
      else if(fd.t==='num'){const t=String(d[fd.k]||'').trim();it[fd.k]=t===''?'':num(t)}
      else it[fd.k]=String(d[fd.k]||'').trim();}
    if(key==='lights')it.aiFields=d.verified?[]:String(d.aiFields||'').split(',').filter(Boolean);
    const arr=[...(sp[key]||[])];if(idx>=0)arr[idx]=it;else arr.push(it);
    safe(async()=>{await db.doc('spaces/'+sp.id).update({[key]:arr});S.form=null;document.activeElement?.blur?.();rerender()});return}
  if(kind==='plan'){const rows=readPlanForm(f);const data={name:(d.name||'').trim(),rows,sources:String(d.sources||'').split(/\s+/).filter(u=>/^https?:\/\//.test(u))};
    safe(async()=>{if(f.dataset.id)await db.doc('plans/'+f.dataset.id).update(data);else await db.collection('plans').add({...data,projectId:'cultivo',verified:false,createdAt:Date.now()});S.form=null;rerender()});return}
  if(kind==='feedweeks'){safe(async()=>{await db.doc('products/'+f.dataset.id).update({feedWeeks:n2(d.feedWeeks)});document.activeElement?.blur?.();rerender()});return}
  if(kind==='batch'){safe(async()=>{await saveBatch(f,d);S.form=null;document.activeElement?.blur?.();rerender()});return}
  if(kind==='transfer'){const b=S.batches.find(x=>x.id===f.dataset.id);safe(async()=>{await transferBatch(b,num(d.qty),d.dest,d.date||today());S.form=null;rerender()});return}
  if(kind==='finish'){const b=S.batches.find(x=>x.id===f.dataset.id);safe(async()=>{await db.doc('batches/'+b.id).update({status:'finalizado',endDate:d.date||today(),endNote:(d.note||'').trim(),history:[...(b.history||[]),{date:d.date||today(),text:'Finalizado'+(d.note?': '+d.note.trim():'')}]});S.form=null;rerender()});return}
  if(kind==='space'){
    const n=v=>{const t=String(v||'').trim();return t===''?'':num(t)};
    const data={tentBrand:(d.tentBrand||'').trim(),tentModel:(d.tentModel||'').trim(),portsTop:n(d.portsTop),portsBottom:n(d.portsBottom),
      portsTopD:new FormData(f).getAll('portsTopD').map(x=>String(x).trim()),portsBottomD:new FormData(f).getAll('portsBottomD').map(x=>String(x).trim()),cropType:d.cropType||'',lighting:d.lighting||'',width:n(d.width),length:n(d.length),height:n(d.height),temp:n(d.temp),humidity:n(d.humidity)};
    safe(async()=>{await db.doc('spaces/'+f.dataset.id).update(data);S.spaceMsg='Guardado.';document.activeElement?.blur?.();rerender()});return}
  safe(async()=>{
    if(kind==='project'){
      const data={name:d.name.trim(),priority:num(d.priority)||null,goal:(d.goal||'').trim(),why:(d.why||'').trim(),deadline:d.deadline||'',weeklyHours:num(d.weeklyHours),resources:(d.resources||'').trim(),
        scopes:String(d.scopes||'').split(',').map(x=>x.trim()).filter(Boolean)};
      if(f.dataset.id)await db.doc('projects/'+f.dataset.id).update(data);
      else{const r=await db.collection('projects').add({...data,kind:d.kind||'project',createdAt:Date.now()});go(r.id)}
    }else if(kind==='event'){
      const ev={date:d.date||today(),type:d.type||'Otro',title:(d.title||'').trim(),note:(d.note||'').trim(),status:d.status||'planificado'};
      if(RIEGO_USE[ev.type]){const fd=new FormData(f);const ids=fd.getAll('prodId'),ds=fd.getAll('dose'),us=fd.getAll('unit');
        ev.liters=num(d.liters)||'';
        ev.products=ids.map((pid,i)=>{const pr=S.products.find(x=>x.id===pid);return pr?{productId:pid,label:prodLabel(pr),dose:num(ds[i]),unit:us[i]||'ml'}:null}).filter(Boolean);}
      else{ev.products=[];ev.liters='';}
      if(ev.type==='Riego radicular'){ev.batchId=d.batchId||'';ev.perPlant=n2(d.perPlant);ev.drained=d.drained||'';ev.ecIn=n2(d.ecIn);ev.phIn=n2(d.phIn);ev.ecOut=n2(d.ecOut);ev.phOut=n2(d.phOut);}
      if(f.dataset.id){const old=S.events.find(x=>x.id===f.dataset.id)||{};
        if(f.dataset.mode==='edit'){if(d.spaceId)ev.spaceId=d.spaceId;if(ev.status==='planificado'&&(!old.plannedDate||old.plannedDate===old.date))ev.plannedDate=ev.date;}
        else{if(!old.plannedDate&&old.date&&old.date!==ev.date)ev.plannedDate=old.date;ev.adjustNote=(d.adjustNote||'').trim();}
        await db.doc('events/'+f.dataset.id).update(ev);}
      else await db.collection('events').add({...ev,plannedDate:ev.date,projectId:f.dataset.pid,spaceId:d.spaceId||S.space||'',createdAt:Date.now()});
    }else if(kind==='product'){
      const name=(d.name||'').trim();if(!name)return;
      if(d.use==='sustrato'){
        await db.collection('products').add({projectId:'cultivo',use:'sustrato',line:(d.line||'').trim(),name,presentations:(d.presentations||'').trim(),ph:(d.ph||'').trim(),ce:(d.ce||'').trim(),
          usage:(d.usage||'').trim(),composition:(d.composition||'').trim(),weight:(d.weight||'').trim(),feedWeeks:n2(d.feedWeeks),notes:(d.notes||'').trim(),
          sources:String(d.sources||'').split(/\s+/).filter(u=>/^https?:\/\//.test(u)),verified:false,createdAt:Date.now()});
      }else
      await db.collection('products').add({projectId:'cultivo',use:d.use==='foliar'?'foliar':'radicular',line:(d.line||'').trim(),name,unit:d.unit||'ml',createdAt:Date.now()});
      S.form=null;rerender();setTimeout(()=>document.getElementById('c-name')?.focus(),0);return;
    }else if(kind==='move'){
      const amt=num(d.amount);if(amt<=0){S.err='Cargá un monto mayor a cero.';rerender();return}
      await db.collection('money').add({ledgerId:f.dataset.pid,type:d.type==='ingreso'?'ingreso':'gasto',amount:amt,category:(d.category||'').trim(),scope:d.scope||'',date:d.date||today(),note:(d.note||'').trim(),createdAt:Date.now()});
    }else if(kind==='task'){
      const data={title:d.title.trim(),estHours:num(d.estHours),due:d.due||'',status:d.status||'pendiente',resources:d.resources.trim()};
      if(f.dataset.id)await db.doc('tasks/'+f.dataset.id).update(data);
      else await db.collection('tasks').add({...data,projectId:f.dataset.pid,createdAt:Date.now()});
    }else if(kind==='log'){
      const mins=Math.round(num(d.hours)*60);if(mins<=0){S.err='Cargá un tiempo mayor a cero (en horas, ej. 0,5).';rerender();return}
      await db.collection('logs').add({projectId:f.dataset.pid,taskId:f.dataset.tid||'',minutes:mins,date:d.date||today(),note:d.note.trim(),createdAt:Date.now()});
    }
    S.form=null;document.activeElement?.blur?.();rerender();
  });
});

/* ---------- datos ---------- */
const toList=snap=>snap.docs.map(d=>({id:d.id,...d.data()}));
async function boot(){
  rerender();
  const timeout=setTimeout(()=>{if(!db){S.err='No se pudo conectar con el almacenamiento. Abrí esta página con tu sesión de claude.ai iniciada para ver y guardar tus objetivos.';rerender()}},10000);
  try{db=window.claude&&await window.claude.use('db')}catch(e){db=null}
  if(!db){clearTimeout(timeout);S.err='No se pudo conectar con el almacenamiento. Abrí esta página con tu sesión de claude.ai iniciada para ver y guardar tus objetivos.';rerender();return}
  const loadTimer=setTimeout(()=>{if(!S.loaded.projects){S.err='Los datos tardan en llegar. Revisá la conexión.';rerender()}},10000);
  clearTimeout(timeout);
  const onErr=e=>{S.err='Error al leer datos: '+(e&&e.message||'desconocido');rerender()};
  db.collection('projects').onSnapshot(s=>{clearTimeout(loadTimer);S.projects=toList(s);S.loaded.projects=true;if(S.err&&S.err.startsWith('Los datos'))S.err=null;render()},onErr);
  db.collection('tasks').onSnapshot(s=>{S.tasks=toList(s);S.loaded.tasks=true;render()},onErr);
  db.collection('logs').onSnapshot(s=>{S.logs=toList(s);S.loaded.logs=true;render()},onErr);
  db.collection('products').onSnapshot(s=>{S.products=toList(s);render()},onErr);
  db.collection('plans').onSnapshot(s=>{S.plans=toList(s);render()},onErr);
  db.collection('batches').onSnapshot(s=>{S.batches=toList(s);render()},onErr);
  db.collection('spaces').onSnapshot(s=>{S.spaces=toList(s);render()},onErr);
  db.collection('media').onSnapshot(s=>{S.media=toList(s);render()},onErr);
  claude.use('sample').then(x=>{sample=x;rerender()}).catch(()=>{});
  claude.use('assets').then(a=>{assets=a;rerender()}).catch(()=>{});
  db.collection('events').onSnapshot(s=>{S.events=toList(s);render()},onErr);
  db.collection('money').onSnapshot(s=>{S.money=toList(s);render()},onErr);
  db.doc('timer/current').onSnapshot(s=>{S.timer=s.exists?s.data():null;render()},onErr);
}
boot();
})();
